name: delivery_route_tracker
description: A Flutter app for tracking food delivery shifts, route segments, and wait stops.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  flutter_local_notifications: ^18.0.1
  latlong2: ^0.9.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
